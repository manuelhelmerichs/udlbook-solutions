[project]
name = "udl"
version = "0.1.0"
description = "Environment and helper utilities for working through the 'Understanding Deep Learning' book."
authors = [ { name = "Manuel Helmerichs" } ]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "tqdm>=4.66",
  "torch>=2.3",
  "torchvision>=0.18",
  "torchaudio>=2.3",
  "scikit-learn>=1.4",
  "einops>=0.7",
  "pillow>=10.3",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
  "notebook>=7.1",
  "rich>=13.7",
  "pyyaml>=6.0",
]
